name: Build SVCMonitor

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.0.12077973

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Build KPM
        run: |
          make -C kpm clean all \
            KP_DIR="$GITHUB_WORKSPACE/KernelPatch" \
            SDK_DIR="$ANDROID_HOME" \
            NDK_VERSION="$ANDROID_NDK_VERSION"

      - name: Build APK
        run: |
          gradle -p android :app:assembleDebug --no-daemon -Dkotlin.daemon.enabled=false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svcmonitor-build
          if-no-files-found: error
          path: |
            kpm/svc_monitor.kpm
            android/app/build/outputs/apk/debug/app-debug.apk
